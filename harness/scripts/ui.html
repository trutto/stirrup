<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,interactive-widget=resizes-content">
<title>Stirrup</title>
<meta name="theme-color" content="#151517">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stirrup">
<meta name="application-name" content="Stirrup">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --bg:#0a0a0b; --bg2:#111113; --panel:#161619; --panel2:#1c1c1f; --panel3:#222226;
    --line:#232327; --line2:#2f2f35;
    --txt:#ececee; --dim:#a3a3aa; --dim2:#6e6e76;
    --blue:#4f7cff; --blue2:#2f5cff; --amber:#d6a03a; --red:#ff453a; --green:#32d74b;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt)}
  body{font:16px/1.45 Roboto,"Noto Sans",system-ui,-apple-system,"Segoe UI","DejaVu Sans","Liberation Sans",sans-serif;overscroll-behavior:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input,textarea{font:inherit;color:inherit}
  #app{position:fixed;top:0;left:0;right:0;display:flex;flex-direction:column;height:var(--vvh,100dvh);max-width:100vw;overflow:hidden}
  #topbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;
    padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px}
  .ghost{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--dim);font-size:19px}
  .ghost:active{background:#17171a}
  #modelPill{justify-self:center;display:flex;align-items:center;gap:8px;max-width:62vw;
    padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:#131316;
    font-size:14px;font-weight:650;color:var(--txt)}
  #modelPill .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 auto;box-shadow:0 0 7px var(--green)}
  #modelPill .chev{color:var(--dim2);font-size:10px}
  #modelPill .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #modelPill.busy .dot{background:var(--amber);box-shadow:0 0 7px var(--amber);animation:pulse 1s infinite}
  #modelPill.err .dot{background:var(--red);box-shadow:0 0 7px var(--red)}
  #titlerow{display:flex;align-items:center;gap:10px;padding:0 16px 10px}
  #chatTitle{font-size:19px;font-weight:750;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  #ctxChip{flex:0 0 auto;padding:5px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);
    font:11px/1 var(--mono);background:#131316}
  #ctxChip.hot{border-color:#5a2a2a;color:#ff9c94}
  #tabs{display:flex;gap:2px;margin:0 16px 8px;padding:3px;border-radius:999px;background:#141417;border:1px solid var(--line)}
  #tabs button{flex:1;padding:7px 0;border-radius:999px;font-size:13.5px;font-weight:650;color:var(--dim)}
  #tabs button.on{background:var(--blue2);color:#fff}
  #powerbar{display:flex;gap:8px;padding:0 16px 8px}
  #powerbar button{flex:1;padding:11px 14px;border-radius:14px;font-size:14px;font-weight:700;border:1px solid var(--line2);background:#16161a;color:var(--txt)}
  #startBtn{border-color:#2f5cff;background:#10204a;color:#9dbbff}
  #stopBtn{border-color:#5c2b2b;background:#1d1214;color:#ff9c94}

  #scroll{flex:1 1 auto;overflow-y:auto;padding:6px 16px 10px;scroll-behavior:smooth}
  .msg{margin:14px 0}
  .msg.user{display:flex;justify-content:flex-end}
  .ububble{max-width:86%;background:#232327;border-radius:18px;padding:10px 14px;font-size:16.5px;line-height:1.45;
    white-space:pre-wrap;overflow-wrap:anywhere}
  .abody{font-size:16.8px;line-height:1.55;overflow-wrap:anywhere}
  .abody p{margin:0 0 10px}
  .abody p:last-child{margin-bottom:0}
  .abody h2,.abody h3,.abody h4{margin:14px 0 8px;line-height:1.3}
  .abody h2{font-size:18px}.abody h3{font-size:17px}.abody h4{font-size:16px}
  .abody ul,.abody ol{margin:6px 0 10px;padding-left:22px}
  .abody li{margin:3px 0}
  .abody code{font:13.5px/1.4 var(--mono);background:#17171b;padding:1px 5px;border-radius:6px}
  .abody pre{margin:10px 0;padding:12px;background:#131316;border:1px solid var(--line);border-radius:12px;
    overflow-x:auto;font:12.5px/1.5 var(--mono);color:#c9d4e3}
  .abody pre code{padding:0;background:none;font-size:12.5px}
  .abody a{color:var(--blue)}
  .abody blockquote{margin:8px 0;padding:2px 0 2px 12px;border-left:2px solid var(--line2);color:var(--dim)}
  .msg.err .abody{color:#ff9c94}
  .msgActions{display:flex;gap:16px;margin-top:8px;font:11px/1.2 var(--mono);color:var(--dim2)}
  .msgActions button{padding:2px 0}
  .msg.user .ububble:active{filter:brightness(1.25)}
  #msgEdit{width:100%;min-height:110px;max-height:42vh;background:#101013;border:1px solid var(--line2);
    border-radius:12px;color:var(--txt);padding:12px;font:15px/1.45 inherit;resize:vertical;outline:none}
  .sheetRow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .sheetRow .btn{flex:1;min-width:100px}
  .btn.dangerS{border-color:#5c2b2b;background:#1d1214;color:#ff9c94}
  .empty{padding:56px 8px;text-align:center;color:var(--dim2)}
  .empty .big{font-size:30px;margin-bottom:10px;opacity:.7}
  .empty h2{font-size:16.5px;color:var(--dim);margin:0 0 4px;font-weight:650}
  .empty p{font-size:13.5px;margin:0;line-height:1.5}
  .row{margin-top:8px}
  .rowhead{display:flex;align-items:center;gap:8px;width:100%;text-align:left;color:var(--dim);
    font:12.5px/1.4 var(--mono);padding:5px 0}
  .rowhead .chev{color:var(--dim2);transition:transform .15s;flex:0 0 auto}
  .row.open>.rowhead .chev{transform:rotate(90deg)}
  .rowhead b{color:#cfcfd6;font-weight:600}
  .row .body{display:none;margin:2px 0 4px;padding:10px 12px;background:#121215;border:1px solid var(--line);
    border-radius:11px;font:12px/1.5 var(--mono);color:#a9b4c2;white-space:pre-wrap;max-height:280px;overflow:auto}
  .row.open>.body{display:block}
  .steps .srow{border-top:1px solid #1b1b1f;padding:4px 0}
  .steps .srow:first-child{border-top:0}
  .steps .srow .sout{display:none;margin:0 0 6px;padding:9px 11px;background:#121215;border:1px solid var(--line);
    border-radius:10px;font:11.5px/1.5 var(--mono);color:#9fb0c4;white-space:pre-wrap;max-height:240px;overflow:auto}
  .steps .srow.open .sout{display:block}
  .spin{width:11px;height:11px;border-radius:50%;border:2px solid #3a3a42;border-top-color:var(--blue);
    animation:spin .8s linear infinite;flex:0 0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{opacity:.25}}
  .metaErr{color:#ff9c94;font-size:14px;margin-top:6px}
  #composerWrap{padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 6px)}
  #composer{position:relative;overflow:hidden;background:var(--panel2);border:1px solid #2a2a30;border-radius:22px;
    padding:10px 12px 8px;transition:border-color .2s}
  #composer.busy{border-color:#2f3c55}
  #composer .prog{position:absolute;top:0;left:0;right:0;height:2px;overflow:hidden;opacity:0;transition:opacity .2s}
  #composer.busy .prog{opacity:1}
  #composer .prog i{position:absolute;top:0;bottom:0;width:35%;
    background:linear-gradient(90deg,transparent,var(--blue),transparent);animation:slide 1.3s linear infinite}
  @keyframes slide{from{left:-40%}to{left:105%}}
  #input{display:block;width:100%;background:none;border:0;outline:none;resize:none;padding:5px 3px 10px;
    font-size:16.5px;line-height:1.4;max-height:150px;min-height:44px;color:var(--txt)}
  #input::placeholder{color:var(--dim2)}
  #compRow{display:flex;align-items:center;gap:7px}
  #plus{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);color:var(--dim);font-size:18px;
    display:grid;place-items:center;flex:0 0 auto}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:999px;border:1px solid var(--line2);
    background:#151518;color:#b6b6be;font-size:12.5px;font-weight:650;flex:0 0 auto}
  .chip.on.agent{border-color:#5c4716;background:#1c1607;color:var(--amber)}
  .chip.on.think{border-color:#2a4470;background:#0d1524;color:#8fb0ff}
  #spacer{flex:1 1 auto}
  #send{width:36px;height:36px;border-radius:50%;background:#2b2b31;color:#fff;font-size:17px;display:grid;place-items:center;flex:0 0 auto}
  #send:disabled{opacity:.45}
  #stop{width:40px;height:40px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:0 0 auto}
  #stop::before{content:"";width:12px;height:12px;border-radius:3px;background:#fff}
  #status{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px 2px;
    font:11px/1.4 var(--mono);color:var(--dim2);text-align:center;min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #status .sdot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 1s infinite;flex:0 0 auto}
  #status.ok{color:#4f9d6a}
  #status.err{color:#ff9c94}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  #scrim.show{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;bottom:0;left:0;width:86%;max-width:360px;z-index:41;background:#101013;
    border-right:1px solid var(--line);transform:translateX(-101%);transition:transform .22s ease;
    display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px}
  #drawer.show{transform:none}
  .dbrand{display:flex;align-items:center;gap:8px;padding:2px 6px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .dbrand .blogo{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:13px;color:#f9fafb;
    background:linear-gradient(135deg,#4f9cf9,#8b5cf6)}
  .dbrand .bname{font:700 15px/1 var(--sans);color:var(--txt);letter-spacing:-.01em}
  .dbrand .bsub{font:10px/1 var(--mono);color:#81858c;margin-left:auto}
  .dhead{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px}
  .dhead .t{font-size:17px;font-weight:750}
  #newChat{display:flex;align-items:center;gap:8px;width:100%;padding:11px 12px;border-radius:12px;
    border:1px solid var(--line2);background:#17171b;font-size:14px;font-weight:650;margin-bottom:10px}
  #sessionList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:2px 0 6px;scrollbar-width:thin}
  .dsearch{padding:0 6px 10px}
  .dsearch input{width:100%;box-sizing:border-box;background:#1b1b1e;border:1px solid var(--line2);border-radius:10px;
    color:var(--txt);font:13px/1.4 var(--sans);padding:8px 10px;outline:none}
  .dsearch input::placeholder{color:#81858c}
  .dsearch input:focus{border-color:#4b4b52}
  .sgroup{font:600 10.5px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:#81858c;
    padding:12px 8px 5px;position:sticky;top:0;background:var(--bg);z-index:1}
  .sess{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:10px;text-align:left;width:100%;color:var(--txt)}
  .sess:hover{background:#1d1d20}
  .sess.on{background:#2c2c2e}
  .sess .st{flex:1;min-width:0}
  .sess .st .n{font:500 13.5px/1.35 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sess .st .m{font:10.5px/1.3 var(--mono);color:#81858c;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sess .x{color:#81858c;padding:2px 4px;font-size:13px;border-radius:6px;opacity:.4;transition:opacity .12s;flex:0 0 auto}
  .sess:hover .x,.sess.on .x{opacity:1}
  .sess:active .x{opacity:1}
  .sess .x:hover{color:#f25a5a;background:#2a1b1b}
  .sempty{padding:28px 8px;text-align:center;color:#81858c;font-size:12.5px}
  .usec{font:600 10.5px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:#81858c;margin:14px 2px 2px}
  .mcpSrv{border-bottom:1px solid var(--line);padding:8px 0}
  .mcpSrv:last-child{border-bottom:0}
  .mcpHead{display:flex;align-items:center;gap:8px}
  .mdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .mname{font:500 13.5px/1.4 var(--sans);flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mstat{font:10px/1.4 var(--mono);color:#81858c;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mact{font:11px/1 var(--mono);color:#81858c;border:1px solid var(--line2);border-radius:7px;padding:4px 6px;flex:0 0 auto}
  .mact.danger{color:#f25a5a}
  .mcmd{font:10.5px/1.4 var(--mono);color:#81858c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px 0 4px 15px}
  .mtool{display:flex;align-items:center;gap:8px;width:100%;padding:7px 6px 7px 15px;border-radius:8px;text-align:left;color:#cfd3d6}
  .mtool:hover{background:#1d1d20}
  .mtick{width:16px;height:16px;border-radius:5px;border:1px solid var(--line2);display:grid;place-items:center;font-size:11px;color:#22c55e;flex:0 0 auto}
  .mtool.on .mtick{background:#1f3124;border-color:#2b5a37}
  .mtn{font:12.5px/1.3 var(--mono);flex:0 0 auto}
  .mtd{font:10.5px/1.3 var(--mono);color:#81858c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  #mcpAddForm{padding:10px 0 0;display:none}
  #mcpAddForm.show{display:block}
  #mcpAddForm input{width:100%;box-sizing:border-box;margin-bottom:8px;background:#1b1b1e;border:1px solid var(--line2);
    border-radius:10px;color:var(--txt);font:12.5px/1.4 var(--mono);padding:9px 10px;outline:none}
  #mcpAddForm input::placeholder{color:#6f7379}
  #approvalBody{padding:2px 2px 4px}
  #approvalBody .apReason{font:12.5px/1.5 var(--sans);color:var(--dim);margin-bottom:8px}
  #approvalBody .apTool{font:600 11px/1.4 var(--mono);color:#f7ad31;text-transform:uppercase;letter-spacing:.04em}
  #approvalBody .apArgs{background:#1b1b1e;border:1px solid var(--line2);border-radius:10px;padding:10px;
    font:11px/1.5 var(--mono);color:#cfd3d6;white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto;margin:8px 0 0}
  .safetyRow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
  .safetyRow .si{flex:1;min-width:0}
  .safetyRow .sn{font:500 13px/1.4 var(--sans);color:var(--txt)}
  .safetyRow .sd{font:10.5px/1.4 var(--mono);color:#81858c}
  .safetyRoots{font:10.5px/1.5 var(--mono);color:#81858c;padding:8px 2px 2px;word-break:break-all}
  #hfSearchRow{display:flex;gap:8px;margin:4px 0 10px}
  #hfSearchRow input{flex:1;min-width:0;background:#1b1b1e;border:1px solid var(--line2);border-radius:10px;
    color:var(--txt);font:12.5px/1.4 var(--mono);padding:9px 10px;outline:none}
  #hfSearchRow input::placeholder{color:#6f7379}
  #hfSearchRow .btn{flex:0 0 auto}
  #hfStatus{font:11px/1.4 var(--mono);color:#81858c;margin:0 2px 6px;min-height:14px}
  .hfrepo{display:flex;align-items:center;gap:8px;width:100%;padding:9px 8px;border-radius:10px;text-align:left;color:var(--txt);overflow:hidden}
  .hfrepo:hover{background:#1d1d20}
  .hfrepo .ri{flex:1;min-width:0;overflow:hidden}
  .hfrepo .rn{font:500 13px/1.35 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hfrepo .rm{font:10.5px/1.35 var(--mono);color:#81858c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hfrepo .rg{font:10px/1.2 var(--mono);color:#81858c;text-align:right;flex:0 0 auto}
  .hffile{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;overflow:hidden}
  .hffile:hover{background:#1d1d20}
  .hffile .fi{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;overflow:hidden}
  .hffile .fn{display:block;max-width:100%;font:500 12px/1.35 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hffile .fm{display:block;max-width:100%;font:10.5px/1.35 var(--mono);color:#81858c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hffile .btn{flex:0 0 auto;padding:7px 10px;font-size:12px;white-space:nowrap}
  .hfwarn{color:#f7ad31}
  .dlrow{padding:9px 4px;border-bottom:1px solid var(--line)}
  .dlrow:last-child{border-bottom:0}
  .dlhead{display:flex;align-items:center;gap:8px;font:11px/1.3 var(--mono);color:#cfd3d6}
  .dlhead .dn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dlbar{height:5px;border-radius:99px;background:#2c2c2e;margin:7px 0 4px;overflow:hidden}
  .dlbar i{display:block;height:100%;background:#7aaaff;border-radius:99px}
  .dlmeta{font:10px/1.3 var(--mono);color:#81858c}
  .dynrow{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);overflow:hidden}
  .dynrow .yi{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .dynrow .yn{display:block;max-width:100%;font:500 12.5px/1.35 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dynrow .ym{display:block;max-width:100%;font:10.5px/1.35 var(--mono);color:#81858c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dynx{width:24px;height:24px;flex:0 0 auto;border:0;background:transparent;color:#f25a5a;font-size:13px;border-radius:7px;cursor:pointer}
  .dynx:hover{background:#2a1b1b}
  .hsec{font:600 10.5px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:#81858c;margin:12px 2px 4px}
  .dfoot{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line);margin-top:8px}
  .dfoot button{display:flex;align-items:center;gap:9px;padding:10px 10px;border-radius:10px;color:var(--dim);font-size:13.5px}
  #sheetScrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:50}
  #sheetScrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:#151518;border-top:1px solid var(--line2);
    border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
    transform:translateY(101%);transition:transform .22s ease;max-height:86vh;overflow:auto}
  .sheet.show{transform:none}
  .grab{width:38px;height:4px;border-radius:2px;background:#33333a;margin:2px auto 12px}
  .stitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .stitle .t{font-size:16px;font-weight:700}
  .stitle .x{color:var(--dim2);font-size:18px;padding:4px 6px}
  .mitem{display:flex;align-items:center;gap:10px;padding:12px 10px;border-radius:12px;width:100%;text-align:left}
  .mitem.on{background:#1b1b20}
  .mitem .av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2f5cff,#8b5cf6);
    display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;flex:0 0 auto}
  .mitem .i{flex:1;min-width:0;overflow:hidden}
  .mitem .i .n{display:block;font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mitem .i .s{font:10.5px/1.4 var(--mono);color:var(--dim2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .mitem .state{font:10.5px/1 var(--mono);color:var(--dim2);text-align:right;white-space:nowrap;flex:0 0 auto;max-width:92px}

<script>
function fitViewport(){
  const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight || 0;
  if (h) document.documentElement.style.setProperty("--vvh", h + "px");
  document.documentElement.style.setProperty("--vww", Math.min(window.innerWidth || 0, document.documentElement.clientWidth || 0) + "px");
}
addEventListener("resize", fitViewport);
if (window.visualViewport){ visualViewport.addEventListener("resize", fitViewport); visualViewport.addEventListener("scroll", fitViewport); }
setTimeout(fitViewport, 50);
"use strict";
const $ = (id) => document.getElementById(id);
const LS = "localllm-v3";
const OLD = "local-llm-harness-v2";
const SESS_API = "/api/sessions";
let STORE = loadStore();
let SESS_REV = -1, syncPushTimer = 0, syncDirtyIds = new Set(), syncDeletedIds = new Set();
let SYNCED = {}, syncBusy = false, syncPending = false, streamDirtyT = 0;
let state = null, models = [], busy = false, abortCtrl = null;
let ACT = { t0: 0, timer: 0, label: "", doneT: 0 };

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function newSessionObj() { return { id: uid(), title: "New chat", msgs: [], created: Date.now(), updated: Date.now() }; }
function normMsgs(msgs) {
  return msgs.map(m => ({ role: m.role, content: m.content || "", think: m.think || "",
    tools: m.tools || [], steps: m.steps || 0, tps: m.tps || 0, completion: m.completion || 0,
    prompt: m.prompt || 0, cache: m.cache || 0, secs: m.secs || 0, ttft: m.ttft || 0,
    error: !!m.error, stopped: !!m.stopped, agentic: !!m.agentic }));
}
function titleOf(msgs) {
  const u = msgs.find(m => m.role === "user" && m.content);
  const t = (u ? u.content : "New chat").replace(/\s+/g, " ").trim();
  return t.length > 46 ? t.slice(0, 46) + "…" : (t || "New chat");
}
function loadStore() {
  let st = null;
  try { st = JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) {}
  if (st && Array.isArray(st.sessions)) return st;
  st = { v: 3, sessions: [], activeId: null, think: true, agent: false, tab: "chat", lastPick: null };
  try {
    const old = JSON.parse(localStorage.getItem(OLD) || "null");
    if (old && old.chats) {
      for (const k of Object.keys(old.chats)) {
        const msgs = (old.chats[k] || []).filter(m => m && m.content);
        if (msgs.length) st.sessions.push({ id: uid(), title: titleOf(msgs), msgs: normMsgs(msgs), created: Date.now(), updated: Date.now() });
      }
      if (old.think === false) st.think = false;
      if (old.agent) st.agent = true;
    }
  } catch (e) {}
  if (!st.sessions.length) st.sessions.push(newSessionObj());
  st.activeId = [...st.sessions].sort((a, b) => (b.updated || 0) - (a.updated || 0))[0].id;
  try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {}
  return st;
}
function save() {
  try { localStorage.setItem(LS, JSON.stringify(STORE)); } catch (e) {}
  try {
    for (const s of STORE.sessions) {
      if (!s || !s.msgs || !s.msgs.length) continue;
      if ((s.updated || 0) > (SYNCED[s.id] || 0)) syncDirtyIds.add(s.id);
    }
    if (syncDirtyIds.size || syncDeletedIds.size) scheduleSessionPush();
  } catch (e) {}
}
function scheduleSessionPush() { clearTimeout(syncPushTimer); syncPushTimer = setTimeout(pushSessions, 700); }
async function pushSessions() {
  syncPushTimer = 0;
  if (syncBusy) { syncPending = true; return; }
  for (const s of STORE.sessions) {
    if (syncDirtyIds.has(s.id) && (!s.msgs || !s.msgs.length)) syncDirtyIds.delete(s.id);
  }
  const sessions = STORE.sessions.filter(s => syncDirtyIds.has(s.id));
  const deletes = [...syncDeletedIds];
  if (!sessions.length && !deletes.length) return;
  for (const s of sessions) SYNCED[s.id] = s.updated || Date.now();
  syncDirtyIds.clear(); syncDeletedIds.clear();
  syncBusy = true;
  try {
    const r = await fetch(SESS_API, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessions, deletes }) });
    if (!r.ok) throw new Error("http " + r.status);
    syncBusy = false;
    await syncPull(true);
  } catch (e) {
    for (const s of sessions) syncDirtyIds.add(s.id);
    for (const id of deletes) syncDeletedIds.add(id);
    setTimeout(scheduleSessionPush, 5000);
  } finally {
    syncBusy = false;
    if (syncPending) { syncPending = false; syncPull(true); }
  }
}
async function syncPull(force) {
  if (syncBusy && !force) return;
  if (busy) { syncPending = true; return; }
  try {
    const r = await fetch(SESS_API + (SESS_REV >= 0 ? "?since=" + SESS_REV : ""), { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    if (!d) return;
    if (d.unchanged) { SESS_REV = d.revision; return; }
    if (Array.isArray(d.sessions)) {
      SESS_REV = d.revision;
      applyServerSessions(d.sessions, d.tombstones || {});
    }
  } catch (e) {}
}
function applyServerSessions(list, tombstones) {
  let changed = false;
  const byId = new Map(STORE.sessions.map(s => [s.id, s]));
  for (const sv of list) {
    if (!sv || !sv.id) continue;
    const cur = byId.get(sv.id);
    if (!cur) { STORE.sessions.push(sv); changed = true; SYNCED[sv.id] = sv.updated || 0; }
    else if ((sv.updated || 0) > (cur.updated || 0)) { Object.assign(cur, sv); changed = true; SYNCED[sv.id] = sv.updated || 0; }
  }
  for (const id of Object.keys(tombstones || {})) {
    const idx = STORE.sessions.findIndex(s => s.id === id);
    if (idx >= 0) { STORE.sessions.splice(idx, 1); changed = true; delete SYNCED[id]; }
  }
  // sessions that exist only on this device (e.g. history from before sync existed) get uploaded
  const known = new Set(list.map(s => s.id));
  for (const s of STORE.sessions) {
    if (!known.has(s.id) && s.msgs && s.msgs.length) syncDirtyIds.add(s.id);
  }
  if (!STORE.sessions.length) { const ns = newSessionObj(); STORE.sessions.push(ns); STORE.activeId = ns.id; changed = true; }
  if (!STORE.sessions.some(s => s.id === STORE.activeId)) { STORE.activeId = STORE.sessions[STORE.sessions.length - 1].id; changed = true; }
  if (changed) {
    try { localStorage.setItem(LS, JSON.stringify(STORE)); } catch (e) {}
    if (!busy) renderAll();
  }
}
function markStreamingDirty() {
  const now = Date.now();
  if (now - streamDirtyT < 900) return;
  streamDirtyT = now;
  const s = activeSession();
  if (!s || !s.msgs || !s.msgs.length) return;
  s.updated = now;
  syncDirtyIds.add(s.id);
  scheduleSessionPush();
}
function activeSession() {
  let s = STORE.sessions.find(x => x.id === STORE.activeId);
  if (!s) { if (!STORE.sessions.length) STORE.sessions.push(newSessionObj()); s = STORE.sessions[STORE.sessions.length - 1]; STORE.activeId = s.id; }
  return s;
}
function addSession() {
  const s = newSessionObj(); STORE.sessions.push(s); STORE.activeId = s.id; save(); renderAll();
  setTimeout(() => $("input").focus(), 80);
}
function deleteSession(id) {
  STORE.sessions = STORE.sessions.filter(s => s.id !== id);
  if (id) syncDeletedIds.add(id);
  if (!STORE.sessions.length) STORE.sessions.push(newSessionObj());
  if (STORE.activeId === id) STORE.activeId = STORE.sessions[STORE.sessions.length - 1].id;
  save(); renderAll();
}
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtNum = (n) => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);
function timeAgo(ts) {
  const s = Math.max(1, Math.floor((Date.now() - ts) / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
function toast(msg, ms) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms || 2400);
}

/* ---- markdown: fenced blocks, inline code, headings, lists, bold, links ---- */
function md(src) {
  let s = esc(src || "");
  const BT = String.fromCharCode(96);
  const codes = [];
  const chunks = s.split(BT + BT + BT);
  let joined = "";
  for (let i = 0; i < chunks.length; i++) {
    if (i % 2 === 1) {
      let code = chunks[i];
      const nl = code.indexOf("\n");
      if (nl >= 0 && /^[a-zA-Z0-9_-]*$/.test(code.slice(0, nl))) code = code.slice(nl + 1);
      codes.push(code.replace(/\n$/, ""));
      joined += "\u0001P" + (codes.length - 1) + "\u0001";
    } else joined += chunks[i];
  }
  const parts = joined.split(BT);
  let text = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1 && parts[i].indexOf("\n") < 0 && parts[i].trim()) {
      codes.push(parts[i]);
      text += "\u0001C" + (codes.length - 1) + "\u0001";
    } else text += (i % 2 === 1 ? BT + parts[i] + BT : parts[i]);
  }
  let out = fmtBlock(text);
  out = out.replace(/\u0001P(\d+)\u0001/g, (m, i) => "<pre><code>" + codes[+i] + "</code></pre>");
  out = out.replace(/\u0001C(\d+)\u0001/g, (m, i) => "<code>" + codes[+i] + "</code>");
  return out;
}
function fmtBlock(s) {
  s = s.replace(/^#### (.*)$/gm, "<h4>$1</h4>").replace(/^### (.*)$/gm, "<h4>$1</h4>")
       .replace(/^## (.*)$/gm, "<h3>$1</h3>").replace(/^# (.*)$/gm, "<h2>$1</h2>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  const lines = s.split("\n"); const out = []; let inUl = false, inOl = false;
  const close = () => { if (inUl) { out.push("</ul>"); inUl = false; } if (inOl) { out.push("</ol>"); inOl = false; } };
  for (const ln of lines) {
    if (/^\s*[-*] /.test(ln)) { if (!inUl) { close(); out.push("<ul>"); inUl = true; } out.push("<li>" + ln.replace(/^\s*[-*] /, "") + "</li>"); continue; }
    if (/^\s*\d+\. /.test(ln)) { if (!inOl) { close(); out.push("<ol>"); inOl = true; } out.push("<li>" + ln.replace(/^\s*\d+\. /, "") + "</li>"); continue; }
    close(); out.push(ln);
  }
  close();
  return out.join("\n").split(/\n{2,}/).map(p => {
    const t = p.trim();
    if (!t) return "";
    if (/^(<h\d|<ul|<ol|<pre|<\/?(p|li|blockquote))/.test(t) || /^\u0001P\d+\u0001$/.test(t)) return p;
    return "<p>" + p.replace(/\n/g, "<br>") + "</p>";
  }).join("");
}

/* ---- model / state ---- */
function modelName() {
  const m = (state && state.models || []).find(x => x.active) || (state && state.models || [])[0];
  return m ? m.label : "model";
}
function modelKey() { return (state && state.active) || "moe"; }
function msgTps(m) {
  if (!m) return 0;
  if (m.tps) return m.tps;
  if (m.completion && m.secs) return m.completion / m.secs;
  return 0;
}
function modelCtxMax() {
  const am = ((state && state.models) || []).find(m => m.active);
  return (am && am.ctx) || 0;
}
function modelByKey(key) {
  const ms = (state && state.models) || [];
  return ms.find(m => m.key === key) || null;
}
function modelLabel(key) {
  const m = modelByKey(key);
  return m ? m.label : (key || "model");
}
/* Which model the power-bar Start button should load: the running one, the last one
   picked in the Models sheet, else the first chip (that is the harness default). */
function startKey() {
  if (state && state.active) return state.active;
  if (STORE.lastPick && modelByKey(STORE.lastPick)) return STORE.lastPick;
  const ms = (state && state.models) || [];
  return (ms[0] && ms[0].key) || "moe";
}
function lastCtxUsed(s) {
  for (let i = s.msgs.length - 1; i >= 0; i--) {
    const m = s.msgs[i];
    if (m.role === "assistant" && (m.prompt || m.completion)) return (m.prompt || 0) + (m.completion || 0);
  }
  return (state && state.stats && state.stats.ctx_used) || 0;
}

  $("startBtn").hidden = running;
  $("stopBtn").hidden = !running;
  $("startBtn").textContent = "▶ Start " + modelLabel(startKey());
  const bar = $("powerbar");
  if (bar) bar.classList.toggle("need", !running);

}
function renderTop() {
  const st = state || {};

function renderCtxChip() {
  const s = activeSession();
  const used = lastCtxUsed(s);
  const am = (state && state.models || []).find(m => m.active);
  const max = (am && am.ctx) || (state && state.models && state.models[0] && state.models[0].ctx) || 0;
  const pct = max ? Math.round(used / max * 100) : 0;
  const c = $("ctxChip");
  c.textContent = max ? pct + "% ctx" : "ctx —";
  c.classList.toggle("hot", pct >= 85);
}

/* ---- status / activity ---- */
function statusIdle() {
  if (busy) return;
  if (ACT.doneT && performance.now() - ACT.doneT < 3200) return;
  const s = activeSession();
  const turns = s.msgs.filter(m => m.role === "user").length;
  const asst = s.msgs.filter(m => m.role === "assistant" &&
    (String(m.content || "").trim() || String(m.think || "").trim() || m.steps || m.tps ||
     m.completion));
  const steps = asst.reduce((a, m) => a + (m.steps || (m.tools ? m.tools.length : 0)), 0);
  const last = asst[asst.length - 1] || {};
  const el = $("status"); el.className = "";
  if (!turns) {
    const cm = modelCtxMax();
    el.textContent = modelName() + " · " + ((state && state.phase) || "idle") +
      (cm ? " · " + Math.round(cm / 1024) + "k ctx" : "");
    return;
  }
  const bits = [turns + (turns === 1 ? " turn" : " turns"), steps + (steps === 1 ? " step" : " steps")];
  if (last.ttft && !last.agentic) bits.push("TTFT " + last.ttft.toFixed(1) + "s");
  const _tps = msgTps(last);
  if (_tps) bits.push((last.tps ? "" : "~") + Math.round(_tps) + " tok/s");
  if (last.prompt || last.cache) {
    const pct = Math.min(100, Math.round((last.cache || 0) / Math.max(1, (last.cache || 0) + (last.prompt || 0)) * 100));
    bits.push("Cache " + pct + "%");
  }
  el.textContent = bits.join(" · ");
}
function actStart(label) {
  ACT.t0 = performance.now(); ACT.label = label || "Working"; ACT.doneT = 0;
  $("composer").classList.add("busy");
  if (!ACT.timer) ACT.timer = setInterval(actTick, 100);
  actTick();
}
function actSet(label) { if (!ACT.t0) return; ACT.label = label || ACT.label; actTick(); }
function actTick() {
  if (!ACT.t0) return;
  const s = (performance.now() - ACT.t0) / 1000;
  let lab = ACT.label;
  if (typeof lab === "function") { try { lab = lab(s); } catch (e) { lab = ACT.label = "Working"; } }
  const el = $("status"); el.className = "";
  el.innerHTML = '<span class="sdot"></span>' + esc(lab) + " · " + (s < 60 ? s.toFixed(1) + "s" : Math.round(s / 60) + "m" + String(Math.round(s % 60)).padStart(2, "0") + "s");
}
function actDone(label, ok) {
  if (ACT.timer) clearInterval(ACT.timer);
  ACT.timer = 0;
  const s = ACT.t0 ? (performance.now() - ACT.t0) / 1000 : 0;
  ACT.t0 = 0; ACT.doneT = performance.now();
  $("composer").classList.remove("busy");
  const el = $("status"); el.className = ok ? "ok" : "err";
  el.textContent = (ok ? "✓ " : "⚠ ") + (label || "Done") + (s ? " · " + s.toFixed(1) + "s" : "");
  setTimeout(() => { if (performance.now() - ACT.doneT > 3000) statusIdle(); }, 3400);
}

function msgHtml(m, i) {
  if (m.role === "user") return '<div class="msg user" data-ui="' + i + '"><div class="ububble">' +
    (m.image ? '<img class="uimg" src="' + m.image + '" alt="attached image">' : "") + esc(m.content) + "</div></div>";
  return '<div class="msg assistant' + (m.error ? " err" : "") + '" data-i="' + i + '">' + asstInner(m, i) + "</div>";
}
function asstInner(m, i) {
  let h = "";
  if (m.think) h += thinkHtml(m);
  if (m.compacted) {
    const _cs = Array.isArray(m.compacted) ? m.compacted : [m.compacted];
    const _c = _cs[_cs.length - 1] || {};
    h += '<div class="row compact' + (m.openCompact ? " open" : "") + '"><button class="rowhead" data-row="compact">' +
      '<span class="chev">›</span><b>Compacted</b> · ' + esc((_c.dropped || 0) + " msgs folded") +
      (_c.summaryTokens ? " · summary " + fmtNum(_c.summaryTokens) + " tok" : "") + "</button>" +
      '<div class="body">' + esc(_c.summary || "") + "</div></div>";
  }
  if (m.content) h += '<div class="abody">' + md(m.content) + "</div>";
  else if (m.error) h += '<div class="metaErr">' + esc(m.errorMsg || "Request failed") + "</div>";
  else if (!m.think && !m.agentic) h += '<div class="abody"><span class="spin"></span></div>';
  else if (m.agentic && !(m.tools && m.tools.length)) h += '<div class="abody" style="color:var(--dim2)">…</div>';
  if (m.stopped) h += '<div class="metaErr">stopped</div>';
  if (m.tools && m.tools.length) h += stepsHtml(m);
  if (!busy && i != null && i >= 0) {
    const s = activeSession();
    let lastA = -1;
    s.msgs.forEach((x, k) => { if (x.role === "assistant") lastA = k; });
    h += '<div class="msgActions"><button data-act="copy" data-i="' + i + '">Copy</button>' +
      (i === lastA ? '<button data-act="regen" data-i="' + i + '">↻ Regenerate</button>' : "") + "</div>";
  }

}
function reasonSummary(text, running) {
  let t = String(text || "");
  t = t.replace(/[`*_#>]+/g, " ").replace(/[\r\n\t ]+/g, " ").trim();
  t = t.replace(/^thinking process[:\s-]*/i, " ").replace(/\s+/g, " ").trim();
  if (!running) return t.slice(0, 200);
  // while running, show the latest words so the one-line summary visibly advances
  let tail = t.slice(-170);
  const sp = tail.indexOf(" ");
  if (sp > 0) tail = tail.slice(sp + 1);
  return (t.length > 170 ? "…" : "") + tail;
}
function thinkHtml(m) {
  const running = !!m.thinking;
  const open = m.openThink === true;
  const ms = m.thinkMs ? (m.thinkMs / 1000).toFixed(1) + "s" : "";
  const sum = running ? reasonSummary(m.think, true) : "";
  let h = '<div class="think-block" data-open="' + (open ? "1" : "0") + '">';
  h += '<div class="think-row" data-think="toggle" role="button" tabindex="0">' +
    '<span class="tic">◐</span><span class="tlabel">Thinking</span>' +
    (running ? '<span class="tsep"></span><span class="tsum run"><span>' + esc(sum) + '</span></span>' : "") +
    (ms ? '<span class="tmeta">' + ms + '</span>' : "") +
    '<span class="tchev">›</span></div>';
  h += '<div class="think-body">' + md(String(m.think || "")) + '</div></div>';
  return h;
}
function stepsHtml(m) {
  const tools = m.tools || [];
  const pending = tools.find(t => t.pending);
  const names = {};
  tools.forEach(t => { names[t.name] = (names[t.name] || 0) + 1; });
  const nm = Object.keys(names).map(n => names[n] > 1 ? n + " ×" + names[n] : n).join(", ");
  const ms = tools.reduce((a, t) => a + (t.ms || 0), 0);
  const head = pending ? "<b>" + esc(pending.name) + "</b> running…" : "<b>" + tools.length + "</b> step" + (tools.length > 1 ? "s" : "") + " · " + esc(nm);
  const time = pending ? "" : (ms >= 1000 ? (ms / 1000).toFixed(1) + "s" : ms + "ms");
  let h = '<div class="row steps' + (m.openSteps ? " open" : "") + '"><button class="rowhead" data-row="steps">' +
    '<span class="chev">›</span>' + head + '<span style="flex:1"></span><span>' + time + "</span></button>" +
    '<div class="body" style="padding:4px 10px">';
  for (const t of tools) {
    const t1 = t.ms == null ? "" : (t.ms >= 1000 ? (t.ms / 1000).toFixed(1) + "s" : t.ms + "ms");
    h += '<div class="srow' + (t.open ? " open" : "") + '"><button class="rowhead" data-srow><span class="chev">›</span>' +
      (t.pending ? '<span class="spin"></span>' : "") + esc(t.name) + " · " + esc(String(t.arg || "").slice(0, 60)) +
      '<span style="flex:1"></span><span>' + t1 + "</span></button>" +
      '<div class="sout">' + esc(t.output || (t.pending ? "running…" : "")) + "</div></div>";
  }
  return h + "</div></div>";
}
function bindRows() {
  document.querySelectorAll("#chatView .think-row[data-think]").forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = "1";
    btn.addEventListener("click", (ev) => {
      ev.preventDefault();
      const host = btn.closest(".msg"); const i = host ? +host.dataset.i : -1;
      const m = i >= 0 ? activeSession().msgs[i] : null;
      if (!m) return;
      m.openThink = !m.openThink;
      host.innerHTML = asstInner(m, i); bindRows();
      if (m.openThink) { const bd = host.querySelector('.think-body'); if (bd) bd.scrollTop = bd.scrollHeight; }
    });
  });
  document.querySelectorAll("#chatView .rowhead").forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = "1";
    btn.addEventListener("click", (ev) => {
      ev.preventDefault();
      const host = btn.closest(".msg");
      const i = host ? +host.dataset.i : -1;
      const m = i >= 0 ? activeSession().msgs[i] : null;
      if (btn.hasAttribute("data-srow")) {
        const srow = btn.closest(".srow"); srow.classList.toggle("open");
        if (m && m.tools) {

          if (m.tools[idx]) m.tools[idx].open = srow.classList.contains("open");
        }
      } else {
        const row = btn.closest(".row"); row.classList.toggle("open");
        if (m) {
          if (btn.dataset.row === "think") m.openThink = row.classList.contains("open");
          if (btn.dataset.row === "steps") m.openSteps = row.classList.contains("open");
          if (btn.dataset.row === "compact") m.openCompact = row.classList.contains("open");
        }
      }
    });
  });
}

/* ---- trajectory ---- */
function renderTraj() {
  const box = $("trajView"); const s = activeSession();
  const runs = s.msgs.map((m, i) => ({ m, i })).filter(x => x.m.role === "assistant");
  if (!runs.length) { box.innerHTML = '<div class="trajEmpty">No runs yet. Send a message to see the trajectory.</div>'; return; }
  let h = "";
  runs.forEach(({ m, i }, runNo) => {
    const secs = m.secs ? m.secs.toFixed(1) + "s" : "";
    const _mt = msgTps(m);
    const tps = _mt ? (m.tps ? "" : "~") + Math.round(_mt) + " tok/s" : "";
    const steps = m.steps ? m.steps + " steps" : (m.tools && m.tools.length ? m.tools.length + " steps" : "");
    h += '<div class="trajRun"><div class="trajHead"><b>Turn ' + (runNo + 1) + "</b>" +
      (secs ? "<span>" + secs + "</span>" : "") + (steps ? "<span>" + steps + "</span>" : "") + (tps ? "<span>" + tps + "</span>" : "") + "</div>";
    if (m.think) h += '<div class="row"><button class="rowhead" data-row="think"><span class="chev">›</span> <b>thinking</b></button><div class="body">' + esc(m.think.slice(0, 2000)) + "</div></div>";
    (m.tools || []).forEach(t => {
      h += '<div class="row"><button class="rowhead" data-row="tool"><span class="chev">›</span><b>' + esc(t.name) + "</b> " +
        esc(String(t.arg || "").slice(0, 70)) + '</button><div class="body">' + esc((t.output || "").slice(0, 3000)) + "</div></div>";
    });
    if (m.content) h += '<div class="trajText">' + md(m.content.length > 900 ? m.content.slice(0, 900) + "…" : m.content) + "</div>";
    if (m.error) h += '<div class="metaErr">' + esc(m.errorMsg || "error") + "</div>";
    h += "</div>";
  });
  box.innerHTML = h;
  box.querySelectorAll(".rowhead").forEach(btn => btn.addEventListener("click", () => btn.closest(".row").classList.toggle("open")));
}

/* ---- drawer / sheets ---- */
function openDrawer() { renderDrawer(); $("scrim").classList.add("show"); $("drawer").classList.add("show"); }
function closeDrawer() { $("scrim").classList.remove("show"); $("drawer").classList.remove("show"); }
function drawerGroup(ts) {
  const d = new Date(ts || 0), now = new Date();
  const day = 86400000;
  const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if (d.getTime() >= midnight) return "Today";
  if (d.getTime() >= midnight - day) return "Yesterday";
  if (d.getTime() >= midnight - 7 * day) return "Previous 7 days";
  if (d.getTime() >= midnight - 30 * day) return "Previous 30 days";
  return "Older";
}
function renderDrawer() {
  const list = $("sessionList"); if (!list) return;
  const q = (($("sessSearch") && $("sessSearch").value) || "").trim().toLowerCase();
  let arr = STORE.sessions.filter(s => s.msgs && s.msgs.length);
  const active = STORE.sessions.find(s => s.id === STORE.activeId);
  if (active && !arr.some(s => s.id === active.id)) arr.push(active);
  if (q) arr = arr.filter(s => (s.title || "").toLowerCase().includes(q) ||
    s.msgs.some(m => (m.content || "").toLowerCase().includes(q)));
  arr.sort((a, b) => (b.updated || 0) - (a.updated || 0));
  list.innerHTML = "";
  if (!arr.length) {
    list.innerHTML = '<div class="sempty">' + (q ? "No chats match “" + esc(q) + "”" : "No saved chats yet") + "</div>";
    return;
  }
  const head = document.querySelector("#drawer .dhead .t");
  if (head) head.textContent = "Chats" + (arr.length ? " · " + arr.length : "");
  let group = "";
  for (const s of arr) {
    const g = drawerGroup(s.updated || s.created || 0);
    if (g !== group) {
      const h = document.createElement("div"); h.className = "sgroup"; h.textContent = g;
      list.appendChild(h); group = g;
    }
    const turns = s.msgs.filter(m => m.role === "user").length;
    const b = document.createElement("button");
    b.className = "sess" + (s.id === STORE.activeId ? " on" : "");
    b.innerHTML = '<div class="st"><div class="n">' + esc(s.title || "New chat") + '</div><div class="m">' +
      turns + (turns === 1 ? " turn" : " turns") + " · " + timeAgo(s.updated || s.created) + "</div></div>";
    const x = document.createElement("span"); x.className = "x"; x.textContent = "✕"; x.title = "Delete chat";
    x.addEventListener("click", (e) => {
      e.stopPropagation();
      if (confirm("Delete this chat?")) deleteSession(s.id);
    });
    b.appendChild(x);
    b.addEventListener("click", () => { STORE.activeId = s.id; save(); closeDrawer(); renderAll(); });
    list.appendChild(b);
  }
}

  closeDrawer();
  const s = activeSession(); const st = state || {}; const stt = st.stats || {};
  const asst = s.msgs.filter(m => m.role === "assistant");
  const steps = asst.reduce((a, m) => a + (m.steps || (m.tools ? m.tools.length : 0)), 0);

  ];

  const last = asst.filter(m => m.prompt || m.completion).pop() || {};
  const comps = s.msgs.reduce((a, m) => a + (Array.isArray(m.compacted) ? m.compacted.length : (m.compacted ? 1 : 0)), 0);
  const hit = (tot.cache + tot.p) ? Math.round(tot.cache / (tot.cache + tot.p) * 100) : 0;
  const usage = [
    ["last turn", last.prompt ? fmtNum(last.prompt) + " in · " + fmtNum(last.completion || 0) + " out" + (last.tps ? " · " + Math.round(last.tps) + " tok/s" : "") : "—"],
    ["first token", last.ttft ? last.ttft.toFixed(2) + " s" : "—"],

  $("statusBody").innerHTML = rows.map(kv).join("") + '<div class="usec">Usage</div>' + usage.map(kv).join("");
  showSheet("statusSheet");

/* ---- sending ---- */
function setBusy(b) {
  busy = b;
  try { if (window.StirrupNative && window.StirrupNative.setBusy) window.StirrupNative.setBusy(!!b); } catch (e) {}
  $("send").hidden = b; $("stop").hidden = !b;
  $("send").disabled = b || !$("input").value.trim();
  $("composer").classList.toggle("busy", b);
  renderTop();
}
let pendingImage = null;
function clearImgPreview() { pendingImage = null; const p = $("imgPreview"); p.hidden = true; p.querySelector("img").src = ""; }
function setImgPreview(data) { pendingImage = data; const p = $("imgPreview"); p.hidden = false; p.querySelector("img").src = data; autosize(); }
function autosize() {
  const t = $("input"); t.style.height = "auto";
  t.style.height = Math.min(150, Math.max(44, t.scrollHeight)) + "px";
  $("send").disabled = busy || (!t.value.trim() && !pendingImage);
}
async function send() {
  const input = $("input"); const text = input.value.trim();
  if (busy || (!text && !pendingImage)) return;
  if (!text) text = "Describe this image.";
  if (!state || !state.active) { openModels(); toast("Pick a model first"); return; }
  if (state.phase === "loading") { toast("Model still loading…"); return; }

}
async function startTurn(text, opts) {
  opts = opts || {};
  const s = activeSession();
  if (!opts.reuse) s.msgs.push({ role: "user", content: text, image: opts.image || undefined });
  if (!opts.reuse && opts.image) clearImgPreview();
  if (opts.image) STORE.agent = false;
  const asst = { role: "assistant", content: "", think: "", tools: [], steps: 0, agentic: STORE.agent,
    tps: 0, completion: 0, prompt: 0, cache: 0, ttft: 0, secs: 0, error: false, stopped: false };
  s.msgs.push(asst);
  s.updated = Date.now(); s.title = titleOf(s.msgs);
  $("input").value = ""; autosize(); save(); renderAll();
  setBusy(true); abortCtrl = new AbortController();
  const t0 = performance.now();
  actStart(asst.agentic ? "Planning" : "Sending");
  let attempt = 0;
  for (;;) {
    try {
      if (asst.agentic) await runAgent(s, asst, t0); else await runChat(s, asst, t0);
      break;
    } catch (e) {
      if (e.name === "AbortError") { asst.stopped = true; break; }
      const netish = /network|fetch|load failed|terminated|connection|other side/i.test(String(e.message || e));
      if (netish) asst.netError = true;
      // Chat is stateless: retry transparently after a connection blip. Agent runs are NOT
      // retried (tools may already have run) — the user gets a clear error instead.
      if (netish && attempt < 2 && (!asst.agentic || agentSafeRetry(asst))) {
        attempt++;
        resetAsst(asst); asst._phase = "Reconnecting…";
        actSet("Reconnecting…");
        const ok = await waitOnline(25000);
        if (!ok) { asst.error = true; asst.errorMsg = "⚠️ " + friendlyNetError(e); break; }
        continue;
      }
      asst.error = true;
      asst.errorMsg = (netish && asst.agentic)
        ? "⚠️ Connection lost mid-run after actions that may have changed files. Review the steps, then tap Regenerate if it is safe to repeat them."
        : "⚠️ " + friendlyNetError(e);
      break;
    }
  }
  try {
    // (kept as a separate block so the finally below still runs exactly once)
  } finally {
    asst.secs = (performance.now() - t0) / 1000;
    setBusy(false); abortCtrl = null;
    if (asst.error) actDone("Failed", false); else actDone(asst.stopped ? "Stopped" : "Done", !asst.stopped);
    s.updated = Date.now(); save(); renderAll();
    if (pendingApproval) { pendingApproval = null; hideSheets(); }
    if (syncPending) { syncPending = false; syncPull(true); }
  }
}
async function runChat(s, asst, t0) {
  const messages = s.msgs.slice(0, -1).filter(m => m.role && (m.content || m.image)).map(m => ({
    role: m.role,
    content: m.image ? [{ type: "text", text: m.content || "Describe this image." },
                        { type: "image_url", image_url: { url: m.image } }] : m.content
  }));
  let tok = 0, tFirst = 0;
  const res = await fetch("/api/chat", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: modelKey(), think: STORE.think, messages }), signal: abortCtrl.signal
  });
  if (!res.ok) {
    let msg = "request failed (" + res.status + ")";
    try { const j = await res.json(); msg = (j.error && j.error.message) || j.error || msg; } catch (e) {}
    throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));

    const payload = data.join("\n"); data = [];

        const j = JSON.parse(payload);

        if (j.compacted) asst.compacted = j.compacted;
        if (j.trimmed) toast("trimmed " + j.trimmed + " older message" + (j.trimmed > 1 ? "s" : ""));
        renderCtxChip(); actSet(STORE.think ? "Thinking" : "Reading prompt");
      } catch (e) {}
      event = null; return;
    }
    event = null;
    let obj; try { obj = JSON.parse(payload); } catch (e) { return; }
    if (obj.timings) {
      asst.tps = obj.timings.predicted_per_second || asst.tps;
      asst.completion = obj.timings.predicted_n || asst.completion;
      asst.cache = obj.timings.cache_n || asst.cache;
    }
    if (obj.usage) {
      asst.completion = obj.usage.completion_tokens || asst.completion;
      asst.tps = obj.usage.completion_tokens_per_sec || asst.tps;
    }
    const d = obj.choices && obj.choices[0] && obj.choices[0].delta;
    if (d && d.reasoning_content) {
      if (!asst.thinkStart) { asst.thinkStart = performance.now(); actSet("Thinking"); }
      asst.think += d.reasoning_content; asst.thinking = true; liveUpdate(asst);
    }
    if (d && d.content) {
      if (!tFirst) { tFirst = performance.now(); asst.ttft = (tFirst - t0) / 1000; }
      if (asst.thinkStart && !asst.thinkMs) { asst.thinkMs = performance.now() - asst.thinkStart; asst.thinking = false; }
      asst.content += d.content; tok++;
      // Some backends (TabbyAPI/EXL3) pack several tokens into one SSE chunk, so counting
      // chunks under-reports. Estimate from characters for the live line; the final
      // usage/timings event still overwrites this with the exact token count.
      const nTok = Math.max(tok, Math.round(asst.content.length / 3.6));
      asst.completion = nTok;
      actSet(() => {
        const el = tFirst ? (performance.now() - tFirst) / 1000 : 0;
        const tps = el > 0.4 ? nTok / el : 0;
        return "Writing · " + nTok + " tok" + (tps ? " · " + Math.round(tps) + " tok/s" : "");
      });
      liveUpdate(asst);
    }
  };
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      let line = buf.slice(0, i); buf = buf.slice(i + 1);
      if (line.endsWith("\r")) line = line.slice(0, -1);
      if (line === "") { if (event || data.length) handle(); continue; }
      if (line.startsWith("event:")) event = line.slice(6).trim();
      else if (line.startsWith("data:")) data.push(line.slice(5).trim());
    }
  }
  if (asst.thinkStart && !asst.thinkMs) asst.thinkMs = performance.now() - asst.thinkStart;
  asst.thinking = false;
  asst.content = asst.content.trim();
  if (!asst.content) asst.content = "_(no output)_";
  liveUpdate(asst, true);
}
async function runAgent(s, asst, t0) {
  const messages = s.msgs.slice(0, -1).filter(m => m.role && (m.content || m.image)).map(m => ({
    role: m.role,
    content: m.image ? [{ type: "text", text: m.content || "Describe this image." },
                        { type: "image_url", image_url: { url: m.image } }] : m.content
  }));
  const res = await fetch("/api/agent", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: modelKey(), max_steps: 24, think: STORE.think, messages }), signal: abortCtrl.signal
  });
  if (!res.ok) {
    let msg = "agent request failed (" + res.status + ")";
    try { const j = await res.json(); msg = (j.error && j.error.message) || j.error || msg; } catch (e) {}
    throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
  }
  const reader = res.body.getReader(); const dec = new TextDecoder();
  let buf = "", event = null, data = [];
  const stepLabel = (txt) => { asst._phase = txt; actSet(() => (asst._phase || "Working") + (asst.tps ? " · " + Math.round(asst.tps) + " tok/s" : "")); };
  const handle = () => {
    const payload = data.join("\n"); data = [];
    const ev = event; event = null;
    let obj; try { obj = JSON.parse(payload || "{}"); } catch (e) { return; }
    if (ev === "meta") {
      asst.prompt = obj.promptTokens || 0; stepLabel("Planning"); renderCtxChip();
    } else if (ev === "step") {
      asst.steps = obj.n || asst.steps;
      asst._tok0 = 0; asst._tokn = 0;
      stepLabel(obj.final ? "Wrapping up" : "Step " + (asst.steps || 1) + "/24 · planning");
    } else if (ev === "token") {
      if (!asst._tok0) asst._tok0 = performance.now();
      asst._tokn = obj.n || asst._tokn;
      asst._phase = obj.phase || "writing";
      actSet(() => {
        const el = asst._tok0 ? (performance.now() - asst._tok0) / 1000 : 0;
        const tps = el > 0.5 && asst._tokn ? asst._tokn / el : 0;
        return "Step " + (asst.steps || 1) + "/24 · " + asst._phase + " · " + (asst._tokn || 0) +
          " tok" + (tps ? " · " + Math.round(tps) + " tok/s" : "");
      });
      liveUpdate(asst);
    } else if (ev === "usage") {
      asst.prompt = obj.promptTokens || asst.prompt;
      asst.completion = obj.completionTokens || asst.completion;
      asst.tps = obj.tps || asst.tps; asst.cache = obj.cache || asst.cache; stepLabel(asst._phase || "Working");
    } else if (ev === "compacted") {
      asst.compacted = asst.compacted || [];
      asst.compacted.push(obj);
      stepLabel("Compacted context");
      liveUpdate(asst);
    } else if (ev === "thinking") {
      if (!asst.thinkStart) asst.thinkStart = performance.now();
      asst.think = (asst.think ? asst.think + "\n\n" : "") + (obj.content || "");
      asst.thinking = true; stepLabel("Thinking"); liveUpdate(asst);
    } else if (ev === "text") {
      if (asst.thinkStart && !asst.thinkMs) { asst.thinkMs = performance.now() - asst.thinkStart; asst.thinking = false; }
      asst.content = (asst.content ? asst.content + "\n\n" : "") + (obj.content || "");
      if (!asst.ttft) asst.ttft = (performance.now() - t0) / 1000;
      stepLabel("Writing"); liveUpdate(asst);
    } else if (ev === "tool_call") {
      asst.thinking = false;
      asst.tools.push({ name: obj.name, arg: agentArg(obj), args: obj.args || {}, output: "", pending: true, ms: null, open: false });
      stepLabel("Running " + obj.name); liveUpdate(asst);
    } else if (ev === "tool_result") {
      for (let i = asst.tools.length - 1; i >= 0; i--) {
        if (asst.tools[i].pending) { asst.tools[i].output = obj.output || ""; asst.tools[i].ms = obj.ms || 0; asst.tools[i].pending = false; break; }
      }
      stepLabel("Reading result"); liveUpdate(asst);
    } else if (ev === "error") {
      throw new Error(obj.message || "agent error");
    } else if (ev === "approval_request") {
      showApproval(obj);
      stepLabel("Waiting for approval");
    } else if (ev === "done") {
      asst.thinking = false;
      asst.steps = obj.steps || asst.steps; asst.tps = obj.tps || asst.tps;
      asst.prompt = obj.promptTokens || asst.prompt; asst.completion = obj.completionTokens || asst.completion;
      asst.cache = obj.cache || asst.cache;
    }
  };
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      let line = buf.slice(0, i); buf = buf.slice(i + 1);
      if (line.endsWith("\r")) line = line.slice(0, -1);
      if (line === "") { if (event || data.length) handle(); continue; }
      if (line.startsWith("event:")) event = line.slice(6).trim();
      else if (line.startsWith("data:")) data.push(line.slice(5).trim());
    }
  }
  if (asst.thinkStart && !asst.thinkMs) asst.thinkMs = performance.now() - asst.thinkStart;
  asst.thinking = false;
  asst.content = asst.content.trim();
  if (!asst.content) asst.content = "_(the model finished without writing an answer — send it again)_";
  liveUpdate(asst, true);
}
function agentArg(obj) {
  const a = obj.args || {};
  if (a.command) return a.command;
  if (a.path) return a.path;
  if (a.pattern) return a.pattern;
  if (a._raw) return a._raw;
  return Object.keys(a).length ? JSON.stringify(a).slice(0, 80) : "";
}
let livePending = null, liveTimer = 0;
function liveUpdate(asst, force) {
  livePending = asst;
  if (force) { clearTimeout(liveTimer); liveTimer = 0; doLiveUpdate(livePending); return; }
  if (liveTimer) return;
  liveTimer = setTimeout(() => { liveTimer = 0; if (livePending) doLiveUpdate(livePending); }, 120);
}
function doLiveUpdate(asst) {
  const s = activeSession();
  const idx = s.msgs.indexOf(asst);
  const host = document.querySelector('#chatView .msg.assistant[data-i="' + idx + '"]');
  if (host) {
    const stick = atBottom();
    const blk = host.querySelector('.think-block');
    if (asst.thinking && blk && blk.querySelector('.tsum>span')) {
      const sum = blk.querySelector('.tsum>span');
      sum.textContent = reasonSummary(asst.think, true);
      if (blk.dataset.open === "1") {
        const body = blk.querySelector('.think-body');
        if (body) { body.innerHTML = md(String(asst.think || "")); body.scrollTop = body.scrollHeight; }
      }
    } else {
      host.innerHTML = asstInner(asst, idx); bindRows();
      const openBody = host.querySelector('.think-block[data-open="1"] .think-body');
      if (openBody) openBody.scrollTop = openBody.scrollHeight;
    }
    if (stick) scrollEnd(true);
  }
  if (busy) markStreamingDirty();
  if (STORE.tab === "traj") renderTraj();
  renderCtxChip();
  updateJump();
}

/* ---- wiring ---- */
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("composer").addEventListener("submit", (e) => { e.preventDefault(); send(); });
$("stop").addEventListener("click", () => { if (abortCtrl) abortCtrl.abort(); });
$("modelPill").addEventListener("click", openModels);
$("infoBtn").addEventListener("click", openStatus);
$("startBtn").addEventListener("click", async () => {
  const key = startKey();
  $("startBtn").disabled = true;
  try {
    toast("Starting " + modelLabel(key) + "…");
    await fetch("/api/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key }) });
    poll();
  } catch (e) { toast("Cannot reach the harness"); }
  $("startBtn").disabled = false;
});
$("stopTop").addEventListener("click", async () => {
  try { await fetch("/api/stop", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }); poll(); } catch (e) {}
});
$("stopBtn").addEventListener("click", async () => {
  $("stopBtn").disabled = true;
  try {
    toast("Stopped · VRAM + RAM cache cleared");
    await fetch("/api/stop", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    poll();
  } catch (e) { toast("Cannot reach the harness"); }
  $("stopBtn").disabled = false;
});

$("menuBtn").addEventListener("click", openDrawer);
$("drawerX").addEventListener("click", closeDrawer);
$("scrim").addEventListener("click", closeDrawer);
$("sheetScrim").addEventListener("click", hideSheets);
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", hideSheets));
$("sessSearch").addEventListener("input", renderDrawer);
$("sessSearch").addEventListener("keydown", (e) => { if (e.key === "Escape") { $("sessSearch").value = ""; renderDrawer(); } });
$("newChat").addEventListener("click", () => { closeDrawer(); addSession(); });
$("plus").addEventListener("click", () => { $("actInstall").hidden = !installPrompt; showSheet("actsSheet"); });
$("actNew").addEventListener("click", () => { hideSheets(); addSession(); });
$("actModels").addEventListener("click", openModels);
$("actStatus").addEventListener("click", openStatus);
$("actInstall").addEventListener("click", () => { hideSheets(); $("installBtn").click(); });
$("openModels").addEventListener("click", openModels);
$("openStatus").addEventListener("click", openStatus);
$("ctxChip").addEventListener("click", openStatus);
$("stopModel").addEventListener("click", async () => {
  hideSheets();
  try { await fetch("/api/stop", { method: "POST" }); toast("Model unloaded — GPU freed"); poll(); } catch (e) { toast("Cannot reach the harness"); }
});
$("ovdismiss").addEventListener("click", () => $("overlay").classList.remove("show"));
$("jump").addEventListener("click", () => scrollEnd(true));
let msgCtx = -1;
const READ_ONLY_TOOLS = new Set(["sysinfo", "port_owner", "read_file", "grep", "list_dir",
  "web_fetch", "browser_fetch", "web_search", "read_document", "price_lookup", "search_memory",
  "github_latest_release", "hn_top", "github_search", "github_tree", "voice_list", "voice_transcribe"]);
function agentSafeRetry(a) {
  const ts = a.tools || [];
  return ts.length === 0 || ts.every(t => READ_ONLY_TOOLS.has(t.name));
}
function friendlyNetError(e) {
  const s = String((e && e.message) || e || "error");
  if (/network|fetch|load failed|terminated|connection|other side|aborted/i.test(s))
    return "Connection to the laptop was lost — check Tailscale, then try again.";
  return s;
}
function resetAsst(a) {
  a.content = ""; a.think = ""; a.tools = []; a.steps = 0; a.tps = 0; a.completion = 0;
  a.prompt = 0; a.cache = 0; a.ttft = 0; a.secs = 0; a.thinking = false; a.error = false;
  a.errorMsg = ""; a.stopped = false; a.netError = false;
}
async function waitOnline(ms) {
  const end = Date.now() + ms;
  while (Date.now() < end) {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      if (r.ok) { state = await r.json(); renderTop(); return true; }
    } catch (e) {}
    await new Promise(res => setTimeout(res, 1000));
  }
  return false;
}
function maybeAutoResume() {
  if (busy) return;
  const s = activeSession();
  const i = s.msgs.length - 1;
  const a = s.msgs[i];
  if (!a || a.role !== "assistant" || !a.error || !a.netError || a._autoResumed) return;
  if (a.agentic && !agentSafeRetry(a)) return;
  a._autoResumed = true; save();
  setTimeout(() => { if (!busy) regenerate(i); }, 1500);
}
function regenerate(i) {
  if (busy) return;
  const s = activeSession();
  const m = s.msgs[i], prev = s.msgs[i - 1];
  if (!m || m.role !== "assistant") return;
  if (!prev || prev.role !== "user") { toast("Nothing to regenerate"); return; }
  s.msgs = s.msgs.slice(0, i);
  save(); renderAll();
  startTurn(prev.content, { reuse: true });
}
function openUserMsg(i) {
  const m = activeSession().msgs[i]; if (!m) return;
  msgCtx = i; $("msgEdit").value = m.content || ""; showSheet("msgSheet");
}
$("chatView").addEventListener("click", (ev) => {
  const act = ev.target.closest("[data-act]");
  if (act) {
    const i = +act.dataset.i, s = activeSession(), m = s.msgs[i];
    if (!m) return;
    if (act.dataset.act === "copy") copyText(m.content || "");
    else if (act.dataset.act === "regen") regenerate(i);
    return;
  }
  const ub = ev.target.closest(".msg.user");
  if (ub) { openUserMsg(+ub.dataset.ui); return; }
  const pre = ev.target.closest("pre");
  if (pre) copyText(pre.innerText || "");
});
$("msgSave").addEventListener("click", () => {
  const txt = $("msgEdit").value.trim();
  if (!txt || msgCtx < 0) return;
  const s = activeSession();
  s.msgs = s.msgs.slice(0, msgCtx);
  hideSheets(); save(); renderAll();
  startTurn(txt, {});
});
$("msgCopy").addEventListener("click", () => {
  const m = activeSession().msgs[msgCtx]; if (m) copyText(m.content || "");
});
$("msgDelete").addEventListener("click", () => {
  if (msgCtx < 0) return;
  const s = activeSession();
  s.msgs = s.msgs.slice(0, msgCtx);
  msgCtx = -1; hideSheets(); save(); renderAll();
});
$("scroll").addEventListener("scroll", () => updateJump(), { passive: true });

function updateJump() {
  const sc = $("scroll");
  $("jump").classList.toggle("show", sc.scrollHeight - sc.scrollTop - sc.clientHeight > 220);
}
function copyText(t) {
  const done = () => toast("Copied to clipboard", 1400);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done).catch(() => fallbackCopy(t, done));
  } else fallbackCopy(t, done);
}
function fallbackCopy(t, done) {
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("Copy not available"); }
  ta.remove();
}
$("imgClear").addEventListener("click", () => clearImgPreview());
$("input").addEventListener("paste", (e) => {
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for (const it of items) {
    if (it.type && it.type.startsWith("image/")) {
      const f = it.getAsFile();
      if (f) {
        e.preventDefault();
        const r = new FileReader();
        r.onload = () => setImgPreview(r.result);
        r.readAsDataURL(f);
        return;
      }
    }
  }
});
$("imgInput").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => setImgPreview(r.result);
  r.readAsDataURL(f);
  e.target.value = "";
});
$("agentChip").addEventListener("click", () => { STORE.agent = !STORE.agent; save(); renderChips(); toast(STORE.agent ? "⚡ Agent mode on — runs on the model you picked (" + modelName() + ")" : "Agent mode off"); });
$("thinkChip").addEventListener("click", () => { STORE.think = !STORE.think; save(); renderChips(); toast(STORE.think ? "🧠 Thinking on — it reasons before answering" : "Thinking off"); });
document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => { STORE.tab = b.dataset.tab; save(); renderTabs(); if (STORE.tab === "traj") renderTraj(); }));
function renderChips() {

  $("thinkChip").classList.toggle("on", !!STORE.think);
}
let installPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installPrompt = e; $("installBtn").hidden = false; });
$("installBtn").addEventListener("click", async () => {
  closeDrawer();
  if (!installPrompt) { toast("Browser menu → Add to Home screen"); return; }
  installPrompt.prompt(); installPrompt = null; $("installBtn").hidden = true;
});
if (window.visualViewport) {
  const vv = window.visualViewport;
  const adjust = () => document.documentElement.style.setProperty("--vh", vv.height + "px");
  vv.addEventListener("resize", adjust); adjust();
}
renderChips(); renderAll(); poll();
setTimeout(maybeAutoResume, 4000);
setTimeout(() => syncPull(true), 150);
setInterval(() => { if (!busy && document.visibilityState !== "hidden") syncPull(); }, 3000);
window.addEventListener("focus", () => syncPull(true));
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { poll(); syncPull(true); }
});
window.addEventListener("online", () => { poll(); syncPull(true); });
setInterval(() => { if (!busy) statusIdle(); }, 5000);
</script>
